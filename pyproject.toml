[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pittsburgh-rag"
version = "0.1.0"
description = "HW2 corpus collection, sparse and dense QA retrieval, and local evaluation"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
reader = ["torch>=2.2", "transformers>=4.45,<5", "safetensors>=0.4"]
dense = ["sentence-transformers>=3,<6"]
test = ["coverage>=7"]

[project.scripts]
cmu-rag = "cmu_rag.cli:main"

[tool.setuptools.packages.find]
include = ["cmu_rag*"]
